<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind-A/B — Piper vs. go-piper inproc</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:34px 40px 80px; background:#0b0b0f; color:#ececf2;
         font:15px/1.55 -apple-system,"SF Pro Text",system-ui,sans-serif; max-width:980px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:17px; margin:26px 0 10px; }
  p.sub { color:#9a9aa5; margin:0 0 18px; }
  button { font:inherit; cursor:pointer; }
  .primary { background:#3a6ea5; color:#fff; border:none; border-radius:10px; padding:12px 22px; font-weight:600; }
  .primary:hover { background:#4479b2; }
  .progress { color:#9a9aa5; margin-bottom:6px; }
  .bar { height:6px; background:#20202a; border-radius:6px; overflow:hidden; margin-bottom:14px; }
  .bar span { display:block; height:100%; background:#3a6ea5; transition:width .2s; }
  .sentence { border:1px solid #2a2a36; background:#161620; border-radius:12px; padding:12px 16px; margin:0 0 14px; }
  .sentence .lbl { color:#8a8a96; font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .row { display:grid; grid-template-columns:120px 1fr; gap:14px; align-items:center;
         padding:11px 14px; border:1px solid #23232c; border-radius:12px; margin-bottom:9px; background:#14141a; }
  .pname { font-weight:600; }
  .masked { color:#9aa0b4; font-style:italic; }
  audio { width:100%; }
  .choices { display:flex; gap:12px; margin-top:8px; }
  .choices button { flex:1; padding:14px; border-radius:12px; border:1px solid #2b2b38; background:#191922; color:#dcdce8; font-weight:600; }
  .choices button:hover { background:#23324a; }
  .choices .tie { max-width:220px; }
  .score { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin:8px 0 6px; }
  .score .box { border:1px solid #23232c; background:#14141a; border-radius:13px; padding:16px; text-align:center; }
  .score .big { font-size:30px; font-weight:800; }
  .score .who { color:#9a9aa5; font-size:13px; margin-top:4px; }
  .piper { color:#dcecba; } .inproc { color:#cfe8ff; } .tie { color:#e8d79a; }
  pre { white-space:pre-wrap; background:#101016; border:1px solid #23232c; border-radius:12px; padding:16px;
        color:#c9d2e6; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .endbtns { display:flex; gap:12px; margin:16px 0 6px; }
  .endbtns #again { background:#23232c; color:#dcdce8; border:1px solid #33333f; border-radius:10px; padding:11px 18px; }
  .hint { color:#8a8a96; font-size:13px; }
</style>
</head>
<body>
<h1>Blind-A/B — Piper (Referenz) vs. go-piper inproc</h1>
<p class="sub">10 Texte, je zwei Proben (A/B, zufällig). Pro Duell: <b>A besser</b>, <b>B besser</b> oder <b>Gleichstand</b>. Am Ende: Auszählung + Protokoll zum Kopieren.</p>
<main id="app"></main>

<script>
const TEXTS = [
  ["Umlaute",      "Schöne Grüße aus München. Die Bäume blühen, und über den Hügeln singen die Vögel."],
  ["Kurz/schnell", "Kurz und knapp."],
  ["Langsam",      "Langsam und deutlich spreche ich diesen längeren Satz, damit man jeden Laut klar hören kann."],
  ["Neutral",      "Ich bin ein freundlicher Assistent und lese dir deine Antworten vor."],
  ["Rauschen/Klang","Zwischen den Wörtern liegt ein leises, gleichmäßiges Rauschen im Hintergrund."],
  ["Neutral kurz", "Guten Tag. Wie geht es dir heute?"],
  ["Pangramm",     "Der schnelle braune Fuchs springt über den faulen Hund."],
  ["Umlaute 2",    "Über grünen Hügeln schweben weiße Wolken und ein kalter Wind weht."],
  ["Zahlen",       "Eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn."],
  ["Neutral lang", "Am Dienstag treffen wir uns um vier Uhr am Bahnhof und fahren dann weiter."],
];
const pad = (n)=>String(n).padStart(2,"0");
const $ = (id)=>document.getElementById(id);
const app = $("app");
const el = (h)=>{ const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const esc = (s)=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let rounds=[], idx=0;

function newRounds(){
  return TEXTS.map(([aspect,text],k)=>{
    const i=k+1;
    const ref={who:"P", file:"ab/ref_"+pad(i)+".wav"};
    const our={who:"I", file:"ab/our_"+pad(i)+".wav"};
    const flip = Math.random()<0.5;
    return { i, aspect, text, a: flip?our:ref, b: flip?ref:our, choice:null };
  });
}
function renderStart(){
  app.innerHTML="";
  app.appendChild(el(`<section>
    <p class="sub">${TEXTS.length} Duelle. Beide Proben gleich laut. Namen bis zum Ende verborgen.</p>
    <button class="primary" id="go">Turnier starten (${TEXTS.length} Duelle)</button>
  </section>`));
  $("go").onclick=()=>{ rounds=newRounds(); idx=0; renderRound(); };
}
function renderRound(){
  app.innerHTML="";
  const r=rounds[idx];
  const pct=Math.round(idx/rounds.length*100);
  const sec=el(`<section>
    <div class="progress">Duell <b>${idx+1} / ${rounds.length}</b></div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div class="sentence"><div class="lbl">${esc(r.aspect)}</div>${esc(r.text)}</div>
    <div class="row"><div class="pname masked">Probe A</div><audio controls preload=none src="${r.a.file}"></audio></div>
    <div class="row"><div class="pname masked">Probe B</div><audio controls preload=none src="${r.b.file}"></audio></div>
    <div class="choices">
      <button data-p="A">A klingt besser</button>
      <button class="tie" data-p="tie">Gleichstand</button>
      <button data-p="B">B klingt besser</button>
    </div></section>`);
  sec.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>choose(b.dataset.p));
  app.appendChild(sec);
}
function choose(p){
  rounds[idx].choice=p; idx++;
  if(idx>=rounds.length) renderResult(); else renderRound();
}
function tally(){
  let piper=0, inproc=0, tie=0;
  for(const r of rounds){
    if(!r.choice) continue;
    if(r.choice==="tie"){ tie++; continue; }
    const w=(r.choice==="A")?r.a:r.b;
    if(w.who==="P") piper++; else inproc++;
  }
  return {piper,inproc,tie};
}
function resultText(){
  const {piper,inproc,tie}=tally();
  const L=[];
  L.push("Blind-A/B — Piper (Referenz) vs. go-piper inproc");
  L.push("=".repeat(66));
  L.push("");
  L.push(`Piper  (Ref)    : ${piper} / ${rounds.length}`);
  L.push(`go-piper inproc : ${inproc} / ${rounds.length}`);
  L.push(`Gleichstand     : ${tie} / ${rounds.length}`);
  L.push("");
  L.push("Duelle:");
  for(const r of rounds){
    const w=(r.choice==="tie")?"Gleichstand":((r.choice==="A"?"A":"B")+" = "+((r.choice==="A"?r.a:r.b).who==="P"?"Piper":"inproc"));
    L.push(`  #${pad(r.i)} [${r.aspect}] -> ${w}`);
  }
  return L.join("\n");
}
function renderResult(){
  const {piper,inproc,tie}=tally();
  const text=resultText();
  app.innerHTML="";
  const sec=el(`<section>
    <h2>🏆 Auszählung</h2>
    <div class="score">
      <div class="box"><div class="big piper">${piper}/${rounds.length}</div><div class="who">Piper (Referenz)</div></div>
      <div class="box"><div class="big tie">${tie}/${rounds.length}</div><div class="who">Gleichstand</div></div>
      <div class="box"><div class="big inproc">${inproc}/${rounds.length}</div><div class="who">go-piper inproc</div></div>
    </div>
    <h2>Protokoll (zum Kopieren)</h2>
    <pre id="result">${esc(text)}</pre>
    <div class="endbtns">
      <button class="primary" id="copy">Ergebnis kopieren</button>
      <button id="again">neu starten</button>
    </div>
    <p class="hint" id="copystate"></p>
  </section>`);
  app.appendChild(sec);
  $("copy").onclick=async ()=>{
    try{ await navigator.clipboard.writeText(text); $("copystate").textContent="kopiert ✓ — jetzt hier einfügen"; }
    catch(e){
      const r=document.createRange(); r.selectNodeContents($("result"));
      const s=getSelection(); s.removeAllRanges(); s.addRange(r);
      $("copystate").textContent="Text markiert — bitte Cmd-C drücken";
    }
  };
  $("again").onclick=renderStart;
}
renderStart();
</script>
</body>
</html>
